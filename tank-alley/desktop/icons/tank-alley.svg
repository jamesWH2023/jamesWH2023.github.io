<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tank Alley">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2430"/>
      <stop offset="100%" stop-color="#0c1218"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a7a48"/>
      <stop offset="100%" stop-color="#3d5a34"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e0b84a"/>
      <stop offset="100%" stop-color="#b8860b"/>
    </linearGradient>
  </defs>

  <!-- App tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="url(#gold)" stroke-width="10"/>

  <!-- Soft alley vibe -->
  <rect x="72" y="96" width="48" height="150" rx="6" fill="#2a3642" opacity="0.9"/>
  <rect x="392" y="88" width="48" height="160" rx="6" fill="#2a3642" opacity="0.9"/>
  <rect x="84" y="120" width="12" height="16" fill="#d4a017" opacity="0.85"/>
  <rect x="108" y="148" width="12" height="16" fill="#d4a017" opacity="0.55"/>
  <rect x="404" y="118" width="12" height="16" fill="#d4a017" opacity="0.7"/>
  <rect x="428" y="150" width="12" height="16" fill="#d4a017" opacity="0.45"/>

  <!-- Tank (side-ish silhouette, English brand mark) -->
  <g transform="translate(256 250)">
    <!-- Tracks -->
    <rect x="-118" y="28" width="236" height="42" rx="18" fill="#1a1e1a"/>
    <circle cx="-78" cy="49" r="16" fill="#2a2e2a"/>
    <circle cx="-30" cy="49" r="16" fill="#2a2e2a"/>
    <circle cx="22" cy="49" r="16" fill="#2a2e2a"/>
    <circle cx="70" cy="49" r="16" fill="#2a2e2a"/>

    <!-- Hull -->
    <path d="M-108 22 L-95 -8 L70 -8 L108 10 L108 34 L-108 34 Z" fill="url(#hull)"/>
    <path d="M-70 -8 L-40 -28 L55 -28 L78 -8 Z" fill="#4a6b3a"/>

    <!-- Turret -->
    <ellipse cx="8" cy="-42" rx="58" ry="36" fill="#455f38"/>
    <ellipse cx="8" cy="-48" rx="42" ry="22" fill="#526a42"/>
    <rect x="55" y="-52" width="92" height="14" rx="7" fill="#1c2220"/>
    <rect x="140" y="-55" width="18" height="20" rx="4" fill="#2a302c"/>

    <!-- Cupola -->
    <circle cx="28" cy="-62" r="14" fill="#3a5530"/>
  </g>

  <!-- Wordmark -->
  <text x="256" y="400" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="46" font-weight="700" letter-spacing="4"
        fill="#f0f4f8">TANK ALLEY</text>
  <text x="256" y="434" text-anchor="middle"
        font-family="Segoe UI, Helvetica Neue, Arial, sans-serif"
        font-size="18" font-weight="600" letter-spacing="6"
        fill="#d4a017">ALLEY COMBAT</text>
</svg>
